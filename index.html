const app = document.getElementById('app');
const esc = v => String(v).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// Local scratch, never part of the game.
let UI = {screen:'lobby', count:4, names:['','','','',''], cash:CASH_DEFAULT,
          pick:null, selTile:null, sel:null, filter:null, me:null,
          sheet:null, gateCb:null, trade:null, fixWho:null, wipe:false};

const hex = i => COLORS.find(c => c.k === Store.state.players[i].color).hex;
const P = i => Store.state.players[i];

function render() {
  const st = Store.state;
  if (UI.screen === 'host') return renderHost();
  if (UI.screen === 'join') return renderJoin();
  if (UI.screen === 'room') return renderRoom();
  if (UI.screen === 'lobby' || !st) return renderLobby();
  if (UI.screen === 'setup') return renderSetup();
  app.innerHTML = topbar(st)
    + '<div class="stage">'
    + '<div class="boardpane"><div class="boardscroll">' + board(st) + '</div>'
    + '<div class="swipe meta">SWIPE THE MAP SIDEWAYS TO SEE THE WHOLE NEIGHBOURHOOD</div>'
    + legend(st) + '</div>'
    + '<aside class="rail">' + rail(st) + '</aside></div>';
  renderSheet();
}

/* ------------------------------------------------------------- top bar --- */
function topbar(st) {
  if (Session.online() && Session.seat !== null && UI.me === null) UI.me = Session.seat;
  const purse = UI.me !== null
    ? `<button class="purse" data-act="hide-me"><em>YOU</em>${money(P(UI.me).money)}</button>`
    : `<button class="tool" data-act="whoami">MY CASH</button>`;
  return `<header class="topbar">
    <div class="mark"><b>CHINATOWN</b><span>PROPERTY NEGOTIATION · SIX YEARS</span></div>
    <div class="years">${YEARS.map((v, i) => {
      const cls = i + 1 < st.round ? 'past' : i + 1 === st.round ? 'now' : '';
      return `<div class="yr ${cls}"><b>${v.y}</b><i>${v.z}</i><span class="bar"></span></div>`;
    }).join('')}</div>
    <div class="tools">${purse}
      <button class="tool" data-act="trade">TRADE</button>
      <button class="tool" data-act="log">LOG</button>
      <button class="tool" data-act="rules">RULES</button>
      <button class="tool" data-act="undo">UNDO</button>
      <button class="tool" data-act="menu">⋯</button>
    </div></header>`;
}

/* --------------------------------------------------------------- board --- */
// Which lots are live for tapping, and how they read.
function boardFlags(st) {
  const f = {offer:new Set(), chosen:new Set(), free:new Set()};
  if (st.phase === 'deal' && st.deal.drawn)
    for (const id of st.deal.drawn) (UI.pick && UI.pick.has(id) ? f.chosen : f.offer).add(id);
  if (st.phase === 'build' && UI.selTile !== null)
    for (const id of vacantOwnedBy(st, st.turn)) f.free.add(id);
  return f;
}

function board(st) {
  const f = boardFlags(st), filter = UI.filter;
  const locked = st.phase === 'trade' ? lockedLots(st) : new Set();
  const box = o => `left:${o.x}%;top:${o.y}%;width:${o.w}%;height:${o.h}%`;
  let h = `<div class="board"><img class="art" src="${ART.src}" alt="">
           <div class="scrim" style="opacity:${ART.dim}"></div>`;

  for (const s of STREETS)
    h += `<div class="stname ${s.v ? 'v' : ''}" style="${box(s)}"><span>${s.t}</span></div>`;

  for (const b of BLOCKS) {
    h += `<div class="blk" style="${box(b)};grid-template-columns:repeat(${b.cols},1fr);`
       + `grid-template-rows:repeat(${b.rows},1fr)">`;
    for (const id of b.grid) {
      if (!id) { h += '<div class="bldg"></div>'; continue; }
      const cell = st.plots[id], cls = ['lot'];
      // Landlocked lots stay shaded until something is built on them.
      if (!FRONT[id] && !cell.shop) cls.push('back');
      if (f.chosen.has(id)) cls.push('chosen'); else if (f.offer.has(id)) cls.push('offer');
      if (f.free.has(id)) cls.push('free');
      if (UI.sel === id) cls.push('sel');
      if (locked.has(id)) cls.push('locked');
      if (filter && cell.shop !== filter) cls.push('mute');
      let inner = `<span class="ln">${id}</span>`;
      if (cell.shop) {
        const sh = SHOP[cell.shop];
        inner += `<span class="sign" style="background:${sh.bg};color:${sh.fg}">`
               + `<em>${sh.g}</em><i>${sh.max}</i></span>`;
      }
      if (cell.owner !== null) inner += `<span class="own" style="background:${hex(cell.owner)}"></span>`;
      h += `<button class="${cls.join(' ')}" data-lot="${id}">${inner}</button>`;
    }
    h += '</div>';
  }
  return h + '</div>';
}

function legend(st) {
  const f = UI.filter;
  return `<div class="legend">
    <div class="hd"><span class="eyebrow">Shop signs · tap to find on the board</span>
      <span class="meta" style="${f ? 'color:var(--gold-hi)' : ''}">${
        f ? 'SHOWING ' + SHOP[f].n.toUpperCase() + ' — TAP AGAIN TO CLEAR'
          : (st.phase === 'trade' && lockedLots(st).size
              ? 'LOTS RINGED IN ORANGE ARE IN AN OPEN OFFER'
              : 'HATCHED LOTS HAVE NO STREET FRONTAGE')}</span></div>
    <div class="chips">${SHOPS.map(sh => `<button class="${f === sh.k ? 'on' : ''}" data-act="filter" data-k="${sh.k}">
      <span class="sw" style="background:${sh.bg};color:${sh.fg}">${sh.g}<i>${sh.max}</i></span>
      <span class="nm">${sh.n.toUpperCase()}</span></button>`).join('')}</div></div>`;
}

/* ---------------------------------------------------------------- rail --- */
function rail(st) {
  return `<div class="grp people">${roster(st)}</div>`
       + `<div class="grp play">${phasePane(st)}${contextPane(st)}</div>`
       + `<div class="grp info">${lotPane(st)}</div>`;
}

function roster(st) {
  return `<div class="rowbet"><span class="eyebrow">At the table</span>
    <span class="meta">${st.players.length} PLAYERS</span></div>`
  + st.players.map(p => {
      const mine = UI.me === p.id;
      const turn = (st.phase === 'build' || st.phase === 'deal') && st.turn === p.id;
      const sub = [ownedBy(st, p.id).length + ' LOTS', p.tiles.length + ' TILES'];
      if (st.first === p.id) sub.push('FIRST');
      if (turn) sub.push('UP NOW');
      if (st.host === p.id) sub.push('HOST');
      const away = (st.departed || []).indexOf(p.id) >= 0;
      if (away) sub.push('LEFT');
      const meSeat = Session.online() && Session.seat === p.id;
      return `<button class="seat ${turn ? 'turn' : ''} ${away ? 'away' : ''}" data-act="peek" data-i="${p.id}">
        <span class="disc" style="background:${hex(p.id)}"></span>
        <span class="who"><b>${esc(p.name)}${meSeat ? ' (you)' : ''}</b><span>${sub.join(' · ')}</span></span>
        <span class="cash ${mine ? '' : 'hid'}">${mine ? money(p.money) : '••••••'}</span></button>`;
    }).join('');
}

function phasePane(st) {
  const idx = PHASES.indexOf(st.phase);
  const copy = PHASE_COPY[st.phase] || {t:'FINAL ACCOUNTS', d:'Six years done. Count the money.'};
  const next = idx >= 0 && idx < 4 ? PHASE_COPY[PHASES[idx + 1]].t : 'THE END';
  const year = YEARS[Math.min(st.round, 6) - 1];
  return `<div class="pane">
    <div class="rowbet"><span class="eyebrow">${idx >= 0 ? 'Phase ' + (idx + 1) + ' of 5' : 'Game over'}</span>
      <span class="meta">${year.y} · ${year.z}</span></div>
    <div class="segs">${PHASES.map((_, i) =>
      `<span class="${i === idx ? 'now' : (idx > i ? 'done' : '')}"></span>`).join('')}</div>
    <h2>${copy.t}</h2><p>${copy.d}</p>
    <div class="foot"><span>NEXT · ${next}</span><span>BAG · ${st.bag.length} TILES</span></div></div>`;
}

function contextPane(st) {
  if (st.phase === 'deal')   return paneDeal(st);
  if (st.phase === 'tiles')  return paneTiles(st);
  if (st.phase === 'trade')  return Session.online() ? paneOffers(st) + paneHands(st) : paneTrade(st);
  if (st.phase === 'build')  return paneBuild(st);
  if (st.phase === 'income') return paneIncome(st);
  if (st.phase === 'over')   return paneOver(st);
  return '';
}

function paneDeal(st) {
  const d = st.deal, [nDraw, nKeep] = dealFor(st);
  if (d.i >= d.order.length) return '';
  const who = P(d.order[d.i]);
  if (!myTurn(who.id)) {
    return `<div class="pane"><span class="eyebrow">Waiting on</span>
      <h2 style="margin-top:8px">${esc(who.name).toUpperCase()}</h2>
      <p>They are looking over ${nDraw} cards and keeping ${nKeep}. Their screen, their business.</p></div>`;
  }
  if (!d.drawn) {
    return `<div class="pane"><span class="eyebrow">${Session.online() ? 'Your turn' : 'Waiting on'}</span>
      <h2 style="margin-top:8px">${esc(who.name).toUpperCase()}</h2>
      <p>${nDraw} cards each, keep ${nKeep}.${Session.online() ? '' : ' Hand the screen over before tapping.'}</p>
      <button class="act" data-act="deal-go">${Session.online()
        ? 'DEAL ME IN' : 'HAND TO ' + esc(who.name).toUpperCase()}</button></div>`;
  }
  const need = Math.min(nKeep, d.drawn.length), got = UI.pick.size;
  return `<div class="pane">
    <div class="rowbet"><span class="eyebrow">Your cards, ${esc(who.name)}</span>
      <span class="meta" style="${got === need ? 'color:var(--gold-hi)' : ''}">${got} / ${need} KEPT</span></div>
    <p>Tap a card or its lot on the board. Chosen lots glow gold — check what they sit next to before you commit.</p>
    <div class="cards">${d.drawn.map(id => `<button class="deed ${UI.pick.has(id) ? 'on' : ''} ${FRONT[id] ? '' : 'blocked'}"
        data-act="pick" data-i="${id}">
      <b>${id}</b><span>${LOT[id].st.toUpperCase()}</span>
      ${FRONT[id] ? '' : '<span class="warn">NO FRONTAGE</span>'}</button>`).join('')}</div>
    <button class="act" data-act="keep" ${got === need ? '' : 'disabled'}>CLAIM ${need} LOT${need === 1 ? '' : 'S'}</button>
    ${UI.me !== null ? '<button class="act quiet slim" data-act="hide-me">HIDE MY CASH</button>' : ''}</div>`;
}

function paneTiles(st) {
  const [, n] = dealFor(st);
  return `<div class="pane"><span class="eyebrow">Out of the bag</span>
    <p style="margin-top:9px">${n} tiles each, drawn blind and turned over together. ${st.bag.length} tiles left in the bag.</p>
    ${Session.amHost()
      ? '<button class="act" data-act="draw-tiles">DRAW FOR EVERYONE</button>'
      : '<p class="meta" style="margin-top:12px">WAITING FOR THE HOST</p>'}</div>`;
}

function tileHTML(k, idx, live) {
  const sh = SHOP[k];
  return `<div class="tile ${live && UI.selTile === idx ? 'on' : ''}" style="background:${sh.bg};color:${sh.fg}"
    ${live ? `data-act="pick-tile" data-i="${idx}"` : ''}>
    <em>${sh.g}</em><b>${sh.n.toUpperCase()}</b><i>MAX ${sh.max}</i></div>`;
}

// One offer, as everyone at the table sees it.
function offerCard(st, o) {
  const mine = Session.online() && Session.seat === o.to;
  const ours = Session.online() && Session.seat === o.from;
  return `<div class="offer ${mine ? 'tome' : ''}">
    <div class="who">
      <span class="disc" style="background:${hex(o.from)}"></span>
      <b>${esc(P(o.from).name)}</b>
      <span class="arrow">→</span>
      <span class="disc" style="background:${hex(o.to)}"></span>
      <b>${esc(P(o.to).name)}</b>
      ${mine ? '<span class="meta" style="margin-left:auto;color:var(--gold-hi)">FOR YOU</span>' : ''}
    </div>
    <div class="terms">
      <span><i>${esc(P(o.from).name)} gives</i>${esc(listGoods(o.fromMoney, o.fromTiles, o.fromLots))}</span>
      <span><i>${esc(P(o.to).name)} gives</i>${esc(listGoods(o.toMoney, o.toTiles, o.toLots))}</span>
    </div>
    ${mine ? `<div class="offerbtns">
        <button class="act go slim" data-act="offer-yes" data-k="${o.id}">TAKE IT</button>
        <button class="act quiet slim" data-act="offer-counter" data-k="${o.id}">COUNTER</button>
        <button class="act quiet slim" data-act="offer-no" data-k="${o.id}">PASS</button>
      </div>`
      : ours ? `<button class="act quiet slim" data-act="offer-no" data-k="${o.id}">TAKE IT BACK</button>`
      : `<div class="meta" style="margin-top:9px">WAITING ON ${esc(P(o.to).name).toUpperCase()}</div>`}
  </div>`;
}

function paneOffers(st) {
  if (!Session.online()) return '';
  const open = st.offers || [];
  return `<div class="pane"><div class="rowbet"><span class="eyebrow">On the table</span>
      <span class="meta">${open.length ? open.length + ' OPEN' : 'QUIET'}</span></div>
    ${open.length ? open.map(o => offerCard(st, o)).join('')
      : `<p style="margin:9px 0 0">Nothing has been put to anyone yet. Whatever an offer names is locked until it is answered.</p>`}
    <button class="act" data-act="new-offer">MAKE AN OFFER</button>
    ${Session.amHost()
      ? `<button class="act go" data-act="end-trade">EVERYONE'S DONE — BUILD</button>`
      : `<p class="meta" style="margin-top:12px">THE HOST MOVES THE TABLE ON</p>`}</div>`;
}

function paneTrade(st) {
  return `<div class="pane"><span class="eyebrow">On the table</span>
      <p style="margin-top:9px">Talk it out. When a deal lands, record it so the board and the cash stay honest.</p>
      <button class="act" data-act="trade">RECORD A DEAL</button>
      ${Session.amHost()
        ? `<button class="act go" data-act="end-trade">EVERYONE'S DONE — BUILD</button>`
        : `<p class="meta" style="margin-top:12px">THE HOST MOVES THE TABLE ON</p>`}</div>`
    + `<div class="pane"><span class="eyebrow">Tiles in hand</span>`
    + st.players.map(p => `<div style="margin-top:12px">
        <div style="display:flex;align-items:center;gap:8px">
          <span class="disc" style="width:16px;height:16px;background:${hex(p.id)}"></span>
          <b style="font:700 13px/1 var(--sans)">${esc(p.name)}</b>
          <span class="meta" style="margin-left:auto">${ownedBy(st, p.id).length} LOTS</span></div>
        ${p.tiles.length ? '<div class="rack">' + p.tiles.map(k => tileHTML(k)).join('') + '</div>'
                         : '<div class="none">Nothing in hand.</div>'}
      </div>`).join('') + '</div>';
}

// Everyone's loose tiles, so the table can see what is worth asking for.
function paneHands(st) {
  return `<div class="pane"><span class="eyebrow">Tiles in hand</span>`
    + st.players.map(p => `<div style="margin-top:12px">
        <div style="display:flex;align-items:center;gap:8px">
          <span class="disc" style="width:16px;height:16px;background:${hex(p.id)}"></span>
          <b style="font:700 13px/1 var(--sans)">${esc(p.name)}</b>
          <span class="meta" style="margin-left:auto">${ownedBy(st, p.id).length} LOTS</span></div>
        ${p.tiles.length ? '<div class="rack">' + p.tiles.map(k => tileHTML(k)).join('') + '</div>'
                         : '<div class="none">Nothing in hand.</div>'}
      </div>`).join('') + '</div>';
}

function paneBuild(st) {
  const p = P(st.turn), free = vacantOwnedBy(st, p.id).length;
  if (!myTurn(p.id)) {
    return `<div class="pane"><span class="eyebrow">Building</span>
      <h2 style="margin-top:8px">${esc(p.name).toUpperCase()}</h2>
      <p>They are placing ${p.tiles.length} tile${p.tiles.length === 1 ? '' : 's'} across ${free} empty lot${free === 1 ? '' : 's'}.</p>
      ${Session.amHost() ? `<button class="act quiet slim" data-act="end-build-for" data-i="${p.id}">MOVE THE TABLE ON</button>` : ''}
    </div>`;
  }
  return `<div class="pane">
    <div class="rowbet"><span class="eyebrow">Building</span><span class="meta">${free} EMPTY LOTS</span></div>
    <h2 style="margin-top:8px">${esc(p.name).toUpperCase()}</h2>
    <p>${UI.selTile !== null
        ? 'Now tap one of the highlighted lots on the board.'
        : 'Pick a tile, then tap one of your empty lots. Build as many as you like, or none at all.'}</p>
    ${p.tiles.length ? '<div class="rack">' + p.tiles.map((k, i) => tileHTML(k, i, true)).join('') + '</div>'
                     : '<div class="none">No tiles left to build.</div>'}
    <button class="act" data-act="end-build">${esc(p.name).toUpperCase()} IS DONE</button></div>`;
}

function paneIncome(st) {
  return `<div class="pane"><span class="eyebrow">Rents for ${YEARS[st.round - 1].y}</span>
    <table class="led" style="margin-top:10px"><tbody>${st.players.map(p => {
      const list = businesses(st, p.id);
      return `<tr><td><span class="disc" style="display:inline-block;width:12px;height:12px;vertical-align:-1px;background:${hex(p.id)}"></span> ${esc(p.name)}</td>
        <td class="n">${list.length} biz</td>
        <td class="g">${money(list.reduce((a, b) => a + b.pay, 0))}</td></tr>`;
    }).join('')}</tbody></table>
    <button class="act quiet slim" data-act="income-detail">SHOW THE BREAKDOWN</button>
    ${!Session.amHost() ? '<p class="meta" style="margin-top:12px">WAITING FOR THE HOST</p>' : ''}
    ${Session.amHost() ? `<button class="act go" data-act="pay">${st.round < 6
      ? 'PAY OUT · START ' + YEARS[st.round].y : 'PAY OUT · CLOSE THE BOOKS'}</button>` : ''}</div>`;
}

function paneOver(st) {
  const rank = st.players.slice().sort((a, b) => b.money - a.money || shopsOnBoard(st, b.id) - shopsOnBoard(st, a.id));
  return `<div class="pane"><span class="eyebrow">Final standings</span>
    ${rank.map((p, i) => `<div class="rank ${i === 0 ? 'top' : ''}"><span class="pos">${i + 1}</span>
      <span class="disc" style="background:${hex(p.id)}"></span>
      <span class="who"><b style="font:700 14px/1.2 var(--sans)">${esc(p.name)}</b></span>
      <span class="amt">${money(p.money)}</span></div>`).join('')}
    <button class="act quiet" data-act="new-game">START A NEW GAME</button></div>`;
}

function lotPane(st) {
  if (UI.sel === null) return '';
  const id = UI.sel, cell = st.plots[id], run = runAt(st, id);
  const sh = cell.shop ? SHOP[cell.shop] : null;
  const dead = st.roadRule && run && !run.onRoad;
  return `<div class="pane"><span class="eyebrow">Selected lot</span>
    <h2 style="margin-top:9px">${addr(id).toUpperCase()}</h2>
    <div style="margin-top:11px;display:flex;align-items:center;gap:11px">
      <span style="display:flex;align-items:center;justify-content:center;width:46px;height:36px;border-radius:3px;flex:none;font-size:21px;
        background:${sh ? sh.bg : '#2a3546'};color:${sh ? sh.fg : '#7d8593'};box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)">${sh ? sh.g : '—'}</span>
      <span style="min-width:0"><b style="display:block;font:700 14px/1.2 var(--sans);letter-spacing:.06em">${sh ? sh.n.toUpperCase() : 'VACANT LOT'}</b>
        <span style="display:block;margin-top:3px" class="meta">${run ? 'BUSINESS OF ' + run.size + ' · MAX ' + run.max : 'NO SIGN UP'}</span></span></div>
    <div style="margin-top:13px;display:flex;flex-direction:column;gap:9px">
      <div class="rowbet"><span class="meta">OWNER</span>
        <span style="display:flex;align-items:center;gap:7px">
          <span style="width:12px;height:12px;border-radius:50%;background:${cell.owner !== null ? hex(cell.owner) : '#39414f'}"></span>
          <b style="font:700 13px/1 var(--sans)">${cell.owner !== null ? esc(P(cell.owner).name) : 'UNCLAIMED'}</b></span></div>
      <div class="rowbet"><span class="meta">STREET FRONTAGE</span>
        <span style="font:700 13px/1 var(--sans);color:${FRONT[id] ? 'var(--gold-hi)' : '#d98a6a'}">${FRONT[id] ? 'ON A STREET' : 'LANDLOCKED'}</span></div>
      <div class="rowbet"><span class="meta">PAYS THIS YEAR</span>
        <span class="mono" style="font-weight:700;color:${run && !dead ? 'var(--gold-hi)' : '#d98a6a'}">${
          !run ? '—' : dead ? 'NO RENT' : money(run.pay)}</span></div>
      <div class="rowbet"><span class="meta">NEIGHBOURS</span><span class="mono">${NEIGH[id].join(' · ') || 'none'}</span></div>
    </div>
    <button class="act quiet slim" data-act="unsel">CLEAR SELECTION</button></div>`;
}

/* -------------------------------------------------------------- sheets --- */
function openSheet(t, d) { UI.sheet = {t, d}; UI.wipe = false; renderSheet(); }
function closeSheet() { UI.sheet = null; UI.gateCb = null; UI.wipe = false; renderSheet(); }
function gate(player, say, cb) { UI.gateCb = cb; openSheet('gate', {player, say}); }

function toast(msg) {
  const old = document.querySelector('.toast'); if (old) old.remove();
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2200);
}

function renderSheet() {
  const old = document.getElementById('veil'); if (old) old.remove();
  if (!UI.sheet) return;
  const v = document.createElement('div');
  v.id = 'veil';
  v.className = 'veil' + (UI.sheet.t === 'gate' ? '' : ' soft');
  v.innerHTML = SHEETS[UI.sheet.t](Store.state, UI.sheet.d);
  document.body.appendChild(v);
}

const wrap = (title, body, closable = true) => `<div class="sheet"><header><h3>${title}</h3>
  ${closable ? '<button class="xb" data-act="close">✕</button>' : ''}</header><div class="in">${body}</div></div>`;

const SHEETS = {

gate: (st, d) => {
  const year = YEARS[Math.min(st.round, 6) - 1];
  const copy = PHASE_COPY[st.phase] || {t:'ACCOUNTS'};
  return `<div class="pass">
    <div class="lead">PASS THE SCREEN TO</div>
    <div class="name"><span style="background:${hex(d.player)}"></span><b>${esc(P(d.player).name)}</b></div>
    <div class="strip"><span>${year.y}</span><s></s><span>YEAR OF THE ${year.z}</span><s></s><span>${copy.t}</span></div>
    <div class="say">${esc(d.say)}</div>
    <button class="go" data-act="gate-ok">I'M ${esc(P(d.player).name).toUpperCase()} — CONTINUE</button>
    <div><button class="no" data-act="close">NOT ME — GO BACK</button></div></div>`;
},

whoami: st => wrap('Whose cash?',
  `<p style="margin:0 0 14px;font:400 13px/1.45 var(--sans);color:#a8b0bc">Cash is secret. Confirm it's you and your balance shows in the top bar until you hide it.</p>`
  + st.players.map(p => `<button class="seat" style="margin-bottom:8px" data-act="peek" data-i="${p.id}">
      <span class="disc" style="background:${hex(p.id)}"></span>
      <span class="who"><b>${esc(p.name)}</b><span>${ownedBy(st, p.id).length} LOTS · ${shopsOnBoard(st, p.id)} SHOPS</span></span>
      <span class="cash hid">••••••</span></button>`).join('')),

log: st => wrap('Game log',
  `<button class="act quiet slim" data-act="copy-log" style="margin:0 0 12px">COPY THE WHOLE LOG</button>
   <div class="logl">` + st.log.map(l => `<div class="${l.k === 'yy' ? 'yy' : ''}">${esc(l.t)}</div>`).join('') + '</div>'),

income: st => {
  let h = '';
  for (const p of st.players) {
    const list = businesses(st, p.id);
    h += `<div class="lbl" style="display:flex;align-items:center;gap:8px;font-size:11px;color:var(--gold-dim)">
      <span style="width:11px;height:11px;border-radius:50%;background:${hex(p.id)}"></span>${esc(p.name).toUpperCase()}</div>`;
    h += list.length
      ? '<table class="led"><tbody>' + list.map(b => {
          const sh = SHOP[b.shop], dead = st.roadRule && !b.onRoad;
          return `<tr><td>${sh.g} ${sh.n}</td><td class="n">${b.size} of ${sh.max}</td>
            <td>${dead ? '<span style="color:#d98a6a">landlocked</span>'
                       : (b.complete ? '<span style="color:var(--gold-hi)">complete</span>' : 'growing')}</td>
            <td class="${dead ? 'n' : 'g'}" style="${dead ? 'color:#d98a6a' : ''}">${money(b.pay)}</td></tr>`;
        }).join('')
        + `<tr><td colspan="3" style="text-align:right;color:var(--muted)">Total</td>
             <td class="g">${money(list.reduce((a, b) => a + b.pay, 0))}</td></tr></tbody></table>`
      : '<div class="none">Nothing trading yet.</div>';
  }
  return wrap('Income breakdown', h);
},

rules: st => wrap('How a year runs', `
  <ol style="margin:0;padding-left:18px;font:400 13.5px/1.8 var(--sans);color:#b6bdc8">
    <li><b>Deal buildings.</b> Take a handful of cards, keep a set number, stake those lots.</li>
    <li><b>Draw tiles.</b> Blind from the bag, revealed together.</li>
    <li><b>Negotiate.</b> Lots, built shops, loose tiles, cash — anything goes.</li>
    <li><b>Build.</b> In turn order, place tiles on your own empty lots. They never move again.</li>
    <li><b>Settle rents.</b> Six years, then the richest player wins.</li>

function copyText(text, btn) {
  const done = () => { if (btn) btn.textContent = 'COPIED'; toast('Copied to the clipboard'); };
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch (e) { toast('Could not copy'); }
    ta.remove();
  };
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(done, fallback);
  else fallback();
}

function copyLog(btn) {
  const text = Store.state.log.map(l => l.t).join('\n');
  const done = () => { if (btn) btn.textContent = 'COPIED'; toast('Log copied to the clipboard'); };

    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch (e) { toast('Could not copy'); }
    ta.remove();
  };
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(done, fallback);
  else fallback();
}

function transport() { return firebaseReady() ? new FirebaseTransport() : new MemoryTransport(); }

async function hostRoom() {
  const nm = document.getElementById('myname');
  UI.myName = nm ? nm.value : '';
  const c = document.getElementById('cashRange'); if (c) UI.cash = +c.value;
  try {
    Session.onRoom = () => { if (UI.screen === 'room') renderRoom(); else if (Store.state) { UI.screen = 'game'; render(); } };
    await Session.host(transport(), {startCash: UI.cash, seats: UI.count});
    await Session.take(0, (UI.myName || '').trim() || 'Host');
    UI.screen = 'room'; renderRoom();
  } catch (e) { toast(e.message); }
}

async function joinRoom() {
  const code = document.getElementById('joincode'), nm = document.getElementById('myname');
  UI.joinCode = code ? code.value : ''; UI.myName = nm ? nm.value : '';
  if (!UI.joinCode.trim()) return toast('Type the room code first');
  try {
    Session.onRoom = () => { if (UI.screen === 'room') renderRoom(); else if (Store.state) { UI.screen = 'game'; render(); } };
    await Session.join(transport(), UI.joinCode);
    UI.screen = 'room'; renderRoom();
  } catch (e) { toast(e.message); }
}

async function startRoomGame() {
  const room = Session.room;
  const names = room.seats.map((s, i) => (s && s.name) || COLORS[i].n);
  try {
    await Session.begin({names, startCash: room.meta.startCash || CASH_DEFAULT, first: rnd(names.length)});
    UI.screen = 'game'; render();
  } catch (e) { toast(e.message); }
}

function tapLot(id) {
  const st = Store.state;
  if (st.phase === 'deal' && st.deal.drawn && st.deal.drawn.includes(id)) {
    const [, nKeep] = dealFor(st), need = Math.min(nKeep, st.deal.drawn.length);
    if (UI.pick.has(id)) UI.pick.delete(id);
    else { if (UI.pick.size >= need) UI.pick.delete([...UI.pick][0]); UI.pick.add(id); }
    return render();
  }
  if (st.phase === 'build' && UI.selTile !== null) {
    const hand = P(st.turn).tiles;
    if (st.plots[id].owner === st.turn && !st.plots[id].shop) {
      if (send({type:'PLACE', player:st.turn, lot:id, shop:hand[UI.selTile]})) UI.selTile = null;
      return render();
    }
  }
  UI.sel = UI.sel === id ? null : id;
  render();
}

document.addEventListener('click', e => {
  const lotEl = e.target.closest('[data-lot]');
  if (lotEl && Store.state && UI.screen === 'game') return tapLot(+lotEl.dataset.lot);

  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  const i = el.dataset.i !== undefined ? +el.dataset.i : null;
  const v = el.dataset.v !== undefined ? +el.dataset.v : null;
  const k = el.dataset.k, tag = el.dataset.tag;
  const st = Store.state;

  // trade sheet sub-controls
  if (act === 't-money') { UI.trade[tag + 'Money'] = v === 0 ? 0 : UI.trade[tag + 'Money'] + v; return renderSheet(); }
  if (act === 't-tile' || act === 't-lot') {
    const key = tag + (act === 't-tile' ? 'Tiles' : 'Lots'), arr = UI.trade[key], at = arr.indexOf(i);
    at >= 0 ? arr.splice(at, 1) : arr.push(i);
    return renderSheet();
  }

  switch (act) {
    /* lobby */
    case 'go-setup': UI.screen = 'setup'; renderSetup(); break;
    case 'back-lobby':
      Session.leave().then(() => { UI.screen = 'lobby'; renderLobby(); });
      break;
    case 'go-host': UI.screen = 'host'; renderHost(); break;
    case 'go-join': UI.screen = 'join'; renderJoin(); break;
    case 'host-seats': UI.count = v; renderHost(); break;
    case 'host-go': hostRoom(); break;
    case 'join-go': joinRoom(); break;
    case 'take-seat':
      Session.take(i, (UI.myName || '').trim() || COLORS[i].n)
        .then(renderRoom).catch(e => toast(e.message));
      break;
    case 'room-start': startRoomGame(); break;
    case 'room-leave':
      Session.leave().then(() => { UI.screen = 'lobby'; renderLobby(); });
      break;
    case 'copy-code': copyText(Session.code, el); break;
    case 'check-conn':
      openSheet('diag', {rows: [], busy: true});
      checkConnection().then(rows => openSheet('diag', {rows, busy: false}));
      break;
    case 'kick':
      if (send({type: 'DROP_PLAYER', player: i})) { closeSheet(); render(); }
      break;
    case 'resume': UI.screen = 'game'; render(); break;
    case 'count': readSetup(); UI.count = v; renderSetup(); break;
    case 'start': startGame(); break;
    case 'rules-cold': openSheet('rules'); break;

    /* sheets */
    case 'close': closeSheet(); break;
    case 'gate-ok': { const cb = UI.gateCb; UI.gateCb = null; UI.sheet = null; if (cb) cb(); render(); break; }
    case 'log': openSheet('log'); break;
    case 'copy-log': copyLog(el); break;
    case 'rules': openSheet('rules'); break;
    case 'menu': UI.fixWho = null; openSheet('menu'); break;
    case 'whoami': openSheet('whoami'); break;
    case 'income-detail': openSheet('income'); break;
    case 'hide-me': UI.me = null; render(); break;
    case 'peek':
      if (Session.online()) {
        if (i !== Session.seat) { toast('That is not your seat'); break; }
        UI.me = UI.me === i ? null : i;
        closeSheet(); render(); break;
      }
      if (UI.me === i) { UI.me = null; closeSheet(); render(); }
      else gate(i, 'Your balance is about to show in the top bar.', () => { UI.me = i; });
      break;

    /* board helpers */
    case 'filter': UI.filter = UI.filter === k ? null : k; render(); break;
    case 'unsel': UI.sel = null; render(); break;

    /* the game itself */
    case 'deal-go': {
      const who = st.deal.order[st.deal.i];
      const draw = () => {
        if (send(ACTIONS.DEAL_DRAW.make(Store.state))) { UI.pick = new Set(); UI.me = who; }
      };
      // Online everyone has their own screen, so there is nothing to hide behind.
      if (Session.online()) { draw(); render(); }
      else gate(who, 'Nobody else should see which cards you keep.', draw);
      break;
    }
    case 'pick': tapLot(i); break;
    case 'keep': {
      const who = st.deal.order[st.deal.i];
      if (send({type:'DEAL_KEEP', player:who, keep:[...UI.pick]})) {
        UI.pick = null; UI.me = null; UI.sel = null;
      }
      render(); break;
    }
    case 'draw-tiles': send(ACTIONS.DRAW_TILES.make(st)); render(); break;
    case 'trade':
      UI.trade = {a:0, b:1, aMoney:0, bMoney:0, aTiles:[], bTiles:[], aLots:[], bLots:[]};
      openSheet('trade'); break;

    case 'new-offer': {
      const other = st.players.find(p => p.id !== Session.seat && !gone(st, p.id));
      if (!other) { toast('Nobody left to deal with'); break; }
      UI.compose = {to: other.id, fromMoney:0, toMoney:0,
                    fromTiles:[], toTiles:[], fromLots:[], toLots:[]};
      openSheet('compose'); break;
    }
    case 'c-money': UI.compose[tag + 'Money'] = v === 0 ? 0 : UI.compose[tag + 'Money'] + v; renderSheet(); break;
    case 'c-tile': {
      const arr = UI.compose[tag + 'Tiles'], seat = tag === 'from' ? Session.seat : UI.compose.to;
      const free = withoutTiles(P(seat).tiles, lockedTiles(st, seat));
      if (countIn(arr, k) >= countIn(free, k)) {
        UI.compose[tag + 'Tiles'] = arr.filter(x => x !== k);       // tapping past the last one clears
      } else arr.push(k);
      renderSheet(); break;
    }
    case 'c-lot': {
      const arr = UI.compose[tag + 'Lots'], at = arr.indexOf(i);
      at >= 0 ? arr.splice(at, 1) : arr.push(i);
      renderSheet(); break;
    }
    case 'c-send': {
      const d = UI.compose;
      if (send({type:'OFFER_MAKE', to:d.to, fromMoney:d.fromMoney, toMoney:d.toMoney,
                fromTiles:d.fromTiles, toTiles:d.toTiles,
                fromLots:d.fromLots, toLots:d.toLots})) { closeSheet(); render(); }
      break;
    }
    case 'offer-yes': if (send({type:'OFFER_ACCEPT', id:k})) { render(); toast('Done'); } break;
    case 'offer-no': if (send({type:'OFFER_DECLINE', id:k})) render(); break;
    case 'offer-counter': {
      const o = (st.offers || []).find(x => x.id === k);
      if (!o) break;
      // Their offer, turned around: what they wanted from me is now what I hand over.
      UI.compose = {to: o.from,
        fromMoney: o.toMoney, toMoney: o.fromMoney,
        fromTiles: o.toTiles.slice(), toTiles: o.fromTiles.slice(),
        fromLots: o.toLots.slice(), toLots: o.fromLots.slice()};
      send({type:'OFFER_DECLINE', id:k});
      openSheet('compose'); break;
    }
    case 't-do':
      if (send({type:'TRADE', ...UI.trade})) { closeSheet(); render(); toast('Deal recorded'); }
      break;
    case 'end-trade': send({type:'END_TRADE'}); UI.selTile = null; render(); break;
    case 'pick-tile': UI.selTile = UI.selTile === i ? null : i; render(); break;
    case 'end-build': send({type:'END_BUILD', player:st.turn}); UI.selTile = null; render(); break;
    case 'end-build-for': send({type:'END_BUILD', player:i}); render(); break;
    case 'pay':
      if (send({type:'PAYOUT'})) { UI.sel = null; render(); if (Store.state.phase === 'over') openSheet('end'); }
      break;

    /* settings */
    case 'set-first': if (send({type:'SET_FIRST', player:i})) { closeSheet(); render(); } break;
    case 'fix-who': UI.fixWho = UI.fixWho === i ? null : i; renderSheet(); break;
    case 'fix': send({type:'ADJUST_CASH', player:UI.fixWho, amount:v}); renderSheet(); render(); break;
    case 'rule-road': send({type:'SET_ROAD_RULE', on:!st.roadRule}); renderSheet(); render(); break;
    case 'undo':
      closeSheet();
      if (Session.online() && !Session.amHost()) { toast('Only the host can undo'); break; }
      if (!Store.canUndo()) { toast('Nothing to undo'); break; }
      Store.undo(); UI.pick = null; UI.selTile = null; UI.sel = null;
      saveSoon(); render(); toast('Undone');
      break;
    case 'restart':
      if (!UI.wipe) {
        UI.wipe = true;
        el.textContent = 'TAP AGAIN TO WIPE THE BOARD';
        el.classList.add('armed');
        clearTimeout(UI.wipeTimer);
        UI.wipeTimer = setTimeout(() => { UI.wipe = false; renderSheet(); }, 5000);
        break;
      }
      clearTimeout(UI.wipeTimer);
      Storage.clear();
      Store.seed = null; Store.log = []; Store.state = null;
      UI.screen = 'lobby'; UI.wipe = false;
      closeSheet(); renderLobby();
      break;
    case 'new-game': UI.screen = 'setup'; closeSheet(); renderSetup(); break;
  }
});

// The two trade-partner dropdowns.
document.addEventListener('change', e => {
  const who = e.target.closest('[data-act="c-who"]');
  if (who && UI.compose) {
    UI.compose.to = +who.value;
    UI.compose.toMoney = 0; UI.compose.toTiles = []; UI.compose.toLots = [];
    return renderSheet();
  }
  const el = e.target.closest('[data-act="t-who"]');
  if (!el || !UI.trade) return;
  const tag = el.dataset.tag, val = +el.value;
  if (UI.trade[tag === 'a' ? 'b' : 'a'] === val) return renderSheet();
  UI.trade[tag] = val;
  UI.trade[tag + 'Tiles'] = []; UI.trade[tag + 'Lots'] = []; UI.trade[tag + 'Money'] = 0;
  renderSheet();
});

// Live readout on the cash slider, without a re-render that would drop focus.
document.addEventListener('input', e => {
  if (e.target.id !== 'cashRange') return;
  UI.cash = +e.target.value;
  const out = document.getElementById('cashOut');
  if (out) out.textContent = money(UI.cash);
});

/* ---------------------------------------------------------------- boot --- */
(async function boot() {
  const saved = await Storage.get();
  if (saved && saved.seed && saved.seed.v === 1) {
    try {
      Store.load(saved);
      if (Store.state.phase !== 'over') {
        UI.screen = 'game';
        render();
        toast('Picked up where you left off');
        return;
      }
    } catch (e) { /* a save from an older build: start fresh */ }
  }
  renderLobby();
})();

</script>
